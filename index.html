<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ather Energy Desk</title>

  <!-- Fira Sans Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fira Sans', sans-serif;
      font-size: 20px; /* STRICT 20px TYPEFACE SIZE */
      line-height: 1.3;
      background-color: #0d0d0e;
      color: #f0f0f0;
      padding: 50px 100px 100px 100px; /* Top Margin 50px */
      min-height: 100vh;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #222;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    /* Market Metrics Bar */
    .market-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
    }

    .stat-box {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 8px 16px;
      border-radius: 4px;
      display: flex;
      gap: 10px;
    }

    .stat-label {
      color: #888;
      font-weight: 400;
      font-size: 20px;
    }

    .stat-value {
      color: #00b377;
      font-weight: 600;
      font-size: 20px;
    }

    /* Vahan Button - No Green Background */
    .vahan-btn {
      background: transparent;
      color: #f0f0f0;
      border: 1px solid #333;
      font-size: 20px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .vahan-btn:hover {
      background: #18181b;
      border-color: #555;
    }

    /* Newsmap Responsive Grid - No Gutter */
    .newsmap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      grid-auto-rows: auto;
      gap: 0px; /* No gutter */
      border: 1px solid #222;
    }

    /* Article Card Base - Vertical Information Stack */
    .news-tile {
      background-color: #161618;
      border: 1px solid #222225;
      padding: 20px;
      display: flex;
      flex-direction: column; /* Stack all elements top-to-bottom */
      justify-content: flex-start;
      align-items: flex-start;
      text-decoration: none;
      color: #eee;
      cursor: pointer;
      position: relative;
      transition: background 0.15s ease, opacity 0.2s ease;
    }

    .news-tile:hover {
      z-index: 10;
      background-color: #1f1f22;
      outline: 2px solid #58a6ff;
    }

    /* Card Details Stack (One by One) */
    .category-badge {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: block;
    }

    .tile-title {
      font-size: 20px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tile-publisher {
      font-size: 20px;
      font-weight: 400;
      color: #888;
      margin-bottom: 8px;
      display: block;
    }

    .tile-date {
      font-size: 20px;
      font-weight: 400;
      color: #666;
      display: block;
      margin-top: auto;
    }

    /* Category Source Color Coding */
    .news-tile[data-source="BSE Disclosures"] { background-color: #0f1c28; }
    .news-tile[data-source="BSE Disclosures"] .category-badge { color: #3b82f6; }

    .news-tile[data-source="Investor Relations"] { background-color: #0e2216; }
    .news-tile[data-source="Investor Relations"] .category-badge { color: #22c55e; }

    .news-tile[data-source="Software & OTA"] { background-color: #211326; }
    .news-tile[data-source="Software & OTA"] .category-badge { color: #a855f7; }

    .news-tile[data-source="Valuation & Screener"] { background-color: #241b0e; }
    .news-tile[data-source="Valuation & Screener"] .category-badge { color: #f59e0b; }

    .news-tile[data-source="CEO & Leadership"] { background-color: #0c1a24; }
    .news-tile[data-source="CEO & Leadership"] .category-badge { color: #0ea5e9; }

    /* Read State (Reduced Opacity & Color) */
    .news-tile.is-read {
      background-color: #111113 !important;
      opacity: 0.35;
      filter: grayscale(80%);
    }

    .news-tile.is-read .tile-title {
      color: #777 !important;
      text-decoration: line-through;
    }

    #loader {
      font-size: 20px;
      color: #888;
      grid-column: 1 / -1;
      padding: 80px 0;
      text-align: center;
    }

    /* Responsive Adjustments */
    @media (max-width: 1024px) {
      body {
        padding: 50px 30px 50px 30px;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 30px 15px 30px 15px;
      }
      .newsmap-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">Ather Energy Desk</div>

    <!-- Live Market Cap & Current Stock Price -->
    <div class="market-stats">
      <div class="stat-box">
        <span class="stat-label">Market Cap:</span>
        <span class="stat-value">₹59,372 Cr</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Live Price:</span>
        <span class="stat-value">₹1,497.00</span>
      </div>
      <!-- Vahan Dashboard Button without Green Background -->
      <a href="https://vahan.parivahan.gov.in/vahan4dashboard/" target="_blank" rel="noopener" class="vahan-btn">
        Vahan Dashboard ↗
      </a>
    </div>
  </header>

  <!-- Newsmap Grid -->
  <div class="newsmap-grid" id="newsmap-container">
    <div id="loader">Fetching 1-year news archive...</div>
  </div>

  <script>
    const FEEDS = [
      { name: 'BSE Disclosures', tag: 'BSE Filing', url: 'https://news.google.com/rss/search?q=Ather+Energy+BSE+OR+filing+when:1y&hl=en-IN&gl=IN&ceid=IN:en' },
      { name: 'CEO & Leadership', tag: 'CEO Updates', url: 'https://news.google.com/rss/search?q=Tarun+Mehta+Ather+when:1y&hl=en-IN&gl=IN&ceid=IN:en' },
      { name: 'Investor Relations', tag: 'Investor Rel', url: 'https://news.google.com/rss/search?q=Ather+Energy+investor+relations+OR+financial+results+when:1y&hl=en-IN&gl=IN&ceid=IN:en' },
      { name: 'Software & OTA', tag: 'Software & OTA', url: 'https://news.google.com/rss/search?q=Atherstack+OR+"Ather+OTA"+OR+"Ather+update"+when:1y&hl=en-IN&gl=IN&ceid=IN:en' },
      { name: 'Valuation & Screener', tag: 'Valuation & Finance', url: 'https://news.google.com/rss/search?q=Ather+Energy+screener+OR+valuation+OR+revenue+when:1y&hl=en-IN&gl=IN&ceid=IN:en' }
    ];

    // Persistent Local Storage for Read Articles
    function getReadArticles() {
      return JSON.parse(localStorage.getItem('ather_desk_read_articles') || '[]');
    }

    function markAsRead(articleLink, element) {
      const readArticles = getReadArticles();
      if (!readArticles.includes(articleLink)) {
        readArticles.push(articleLink);
        localStorage.setItem('ather_desk_read_articles', JSON.stringify(readArticles));
      }
      element.classList.add('is-read');
    }

    async function renderNewsmap() {
      const container = document.getElementById('newsmap-container');
      const readArticles = getReadArticles();
      let allArticles = [];

      for (const feed of FEEDS) {
        try {
          const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
          const data = await response.json();

          if (data.status === 'ok') {
            data.items.forEach(item => {
              allArticles.push({
                title: item.title,
                link: item.link,
                pubDate: new Date(item.pubDate),
                sourceName: feed.name,
                categoryTag: feed.tag,
                publisher: item.author || feed.name
              });
            });
          }
        } catch (err) {
          console.error("Error loading feed:", feed.name, err);
        }
      }

      // Sort by newest date
      allArticles.sort((a, b) => b.pubDate - a.pubDate);

      if (allArticles.length === 0) {
        container.innerHTML = '<div id="loader">Unable to fetch news feed right now.</div>';
        return;
      }

      // Render Cards Stacked One-by-One Vertically
      container.innerHTML = allArticles.map(article => {
        const isRead = readArticles.includes(article.link) ? 'is-read' : '';
        // Explicitly format date including full YEAR (e.g. 27 Sep 2026)
        const formattedDate = article.pubDate.toLocaleDateString('en-IN', { 
          day: 'numeric', 
          month: 'short', 
          year: 'numeric' 
        });

        return `
          <a class="news-tile ${isRead}" 
             href="${article.link}" 
             target="_blank" 
             rel="noopener" 
             data-source="${article.sourceName}"
             onclick="markAsRead('${article.link}', this)">
            <span class="category-badge">${article.categoryTag}</span>
            <div class="tile-title">${article.title}</div>
            <span class="tile-publisher">${article.publisher}</span>
            <span class="tile-date">${formattedDate}</span>
          </a>
        `;
      }).join('');
    }

    renderNewsmap();
  </script>

</body>
</html>
