<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ather & Auto Live News Feed</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { color: #58a6ff; font-size: 24px; border-bottom: 1px solid #30363d; padding-bottom: 12px; }
    .news-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      transition: transform 0.2s ease;
    }
    .news-card:hover { transform: translateY(-2px); border-color: #58a6ff; }
    .news-meta { font-size: 12px; color: #8b949e; margin-bottom: 8px; display: block; }
    .news-title { font-size: 18px; margin: 0; color: #f0f6fc; text-decoration: none; display: block; }
    .news-title:hover { color: #58a6ff; }
    #loader { color: #8b949e; font-style: italic; }
  </style>
</head>
<body>

  <h1>Automotive & Industry Live News</h1>
  <div id="news-container">
    <p id="loader">Fetching latest news from sources...</p>
  </div>

  <script>
    // 1. Add your favorite RSS Feed URLs here
    const FEEDS = [
      'https://www.autocarindia.com/rss/news',
      'https://www.bikewale.com/rss/news/'
    ];

    async function loadLiveNews() {
      const container = document.getElementById('news-container');
      let allArticles = [];

      for (const url of FEEDS) {
        try {
          // Convert RSS XML to clean JSON using rss2json API
          const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
          const data = await response.json();

          if (data.status === 'ok') {
            data.items.forEach(item => {
              allArticles.push({
                title: item.title,
                link: item.link,
                pubDate: new Date(item.pubDate),
                source: data.feed.title || 'Auto News'
              });
            });
          }
        } catch (err) {
          console.error("Failed to load feed:", url, err);
        }
      }

      // Sort all combined articles by newest first
      allArticles.sort((a, b) => b.pubDate - a.pubDate);

      if (allArticles.length === 0) {
        container.innerHTML = '<p>Unable to load news right now.</p>';
        return;
      }

      // Render top 15 latest articles
      container.innerHTML = allArticles.slice(0, 15).map(article => `
        <div class="news-card">
          <span class="news-meta">${article.source} • ${article.pubDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
          <a class="news-title" href="${article.link}" target="_blank" rel="noopener">${article.title}</a>
        </div>
      `).join('');
    }

    // Automatically trigger on page load
    loadLiveNews();
  </script>
</body>
</html>
