<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ather Energy — Intelligence Hub</title>
  
  <!-- Load single typeface: Fira Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- CSV Parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    /* Reset margins and set Fira Sans as the only typeface */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Fira Sans', sans-serif;
    }

    body {
      background-color: #111111;
      color: #ffffff;
      padding: 1rem;
    }

    /* Page Heading set to 40px */
    .page-title {
      font-size: 40px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #333333;
    }

    /* Section Headers set to 20px */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: #888888;
    }

    /* NewsMap Grid Layout */
    .newsmap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 4px; /* Tight gap like NewsMap */
      margin-bottom: 1.5rem;
    }

    /* Base Tile Style set to 20px font size */
    .news-tile {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.25;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      text-decoration: none;
      color: #ffffff;
      transition: opacity 0.15s ease;
    }

    .news-tile:hover {
      opacity: 0.85;
    }

    /* Category Color Palette (NewsMap visual style) */
    .bg-financials  { background-color: #1b4965; } /* Dark Blue */
    .bg-regulatory  { background-color: #2b2d42; } /* Slate Navy */
    .bg-official    { background-color: #5c0029; } /* Deep Crimson */
    .bg-product     { background-color: #1b522e; } /* Forest Green */
    .bg-leadership  { background-color: #523b00; } /* Dark Amber */
    .bg-market-share{ background-color: #4a154b; } /* Deep Purple */
    .bg-default     { background-color: #222222; } /* Neutral Dark */

    /* Tile Meta Details */
    .tile-category {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 0.5rem;
    }

    .tile-desc {
      font-size: 20px;
      font-weight: 400;
      opacity: 0.85;
      margin-top: 0.5rem;
    }

    .tile-footer {
      font-size: 20px;
      opacity: 0.5;
      margin-top: 1rem;
    }

    /* Loading placeholder text set to 20px */
    .loading {
      font-size: 20px;
      color: #666666;
    }
  </style>
</head>
<body>

  <!-- Page Heading (40px) -->
  <h1 class="page-title">The Ather Gazette</h1>

  <!-- Valuation Ticker Section -->
  <div class="section-title">Valuation Indicators</div>
  <div class="newsmap-grid" id="ticker-container">
    <p class="loading">Loading financial data...</p>
  </div>

  <!-- NewsMap Feed Section -->
  <div class="section-title">Intelligence Sources</div>
  <div class="newsmap-grid" id="sources-container">
    <p class="loading">Loading sources feed...</p>
  </div>

  <script>
    // CSV File locations
    const LIVE_DATA_CSV_URL = './live_data.csv';
    const NEWS_DESK_CSV_URL = './news_desk.csv';

    // Helper function to pick color based on Category name
    function getCategoryColorClass(category) {
      if (!category) return 'bg-default';
      const cat = category.toLowerCase();
      if (cat.includes('financial')) return 'bg-financials';
      if (cat.includes('regulatory')) return 'bg-regulatory';
      if (cat.includes('official')) return 'bg-official';
      if (cat.includes('product')) return 'bg-product';
      if (cat.includes('leadership')) return 'bg-leadership';
      if (cat.includes('market')) return 'bg-market-share';
      return 'bg-default';
    }

    // 1. Fetch & Render Valuation Ticker
    Papa.parse(LIVE_DATA_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const container = document.getElementById('ticker-container');
        if (results.data && results.data.length > 0) {
          container.innerHTML = '';
          results.data.forEach(row => {
            if (row.Metric && row.Value) {
              const tile = document.createElement('div');
              tile.className = 'news-tile bg-financials';
              tile.innerHTML = `
                <div>
                  <div class="tile-category">${row.Metric}</div>
                  <div>${row.Value}</div>
                </div>
              `;
              container.appendChild(tile);
            }
          });
        }
      }
    });

    // 2. Fetch & Render Intelligence Sources in NewsMap Grid
    Papa.parse(NEWS_DESK_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const container = document.getElementById('sources-container');
        if (results.data && results.data.length > 0) {
          container.innerHTML = '';
          results.data.forEach(row => {
            if (row.Source_Name && row.Website_URL) {
              const colorClass = getCategoryColorClass(row.Category);
              
              const tile = document.createElement('a');
              tile.className = `news-tile ${colorClass}`;
              tile.href = row.Website_URL;
              tile.target = '_blank';
              tile.rel = 'noopener';

              tile.innerHTML = `
                <div>
                  <div class="tile-category">${row.Category || 'General'}</div>
                  <div>${row.Source_Name}</div>
                  <div class="tile-desc">${row.Description || ''}</div>
                </div>
                <div class="tile-footer">${row.Source_Date || ''}</div>
              `;
              
              container.appendChild(tile);
            }
          });
        }
      }
    });
  </script>

</body>
</html>
